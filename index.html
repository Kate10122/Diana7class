<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Задания и домашние задания — 7 класс</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 15% 15%, rgba(232, 130, 180, 0.12), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(138, 110, 200, 0.12), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(255, 220, 180, 0.10), transparent 60%),
      linear-gradient(135deg, #fff5fa 0%, #f5f0ff 50%, #fff8ee 100%);
    min-height: 100vh;
    padding: 30px 16px 60px;
    color: #2a1a3a;
    position: relative;
    overflow-x: hidden;
  }

  /* Декоративные элементы на фоне */
  body::before {
    content: "📚✏️💫📝⭐";
    position: fixed;
    top: 8%;
    right: 3%;
    font-size: 60px;
    opacity: 0.06;
    pointer-events: none;
    letter-spacing: 20px;
    animation: floatDeco 8s ease-in-out infinite;
  }
  body::after {
    content: "🌸💖📖🌟🎀";
    position: fixed;
    bottom: 5%;
    left: 2%;
    font-size: 70px;
    opacity: 0.05;
    pointer-events: none;
    letter-spacing: 25px;
    animation: floatDeco 10s ease-in-out infinite reverse;
  }

  @keyframes floatDeco {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(5deg); }
  }

  .container { max-width: 1100px; margin: 0 auto; position: relative; z-index: 2; }

  /* ====== ШАПКА ====== */
  .main-header {
    text-align: center;
    margin-bottom: 44px;
    padding: 24px 20px;
    position: relative;
  }

  .main-header .crown {
    font-size: 46px;
    display: block;
    margin-bottom: 8px;
    animation: crownGlow 3s ease-in-out infinite;
  }

  @keyframes crownGlow {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(232, 130, 180, 0.6)); transform: scale(1); }
    50% { filter: drop-shadow(0 0 24px rgba(232, 130, 180, 1)); transform: scale(1.08); }
  }

  .main-header h1 {
    font-size: 40px;
    font-weight: 800;
    background: linear-gradient(135deg, #d46a98, #a06ac8, #d4a06a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -1px;
    margin-bottom: 10px;
    line-height: 1.15;
  }

  .main-header .subtitle {
    font-size: 15px;
    font-weight: 700;
    color: #a87ab8;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .main-header p {
    font-size: 17px;
    color: #6a5a7a;
    font-style: italic;
    max-width: 620px;
    margin: 0 auto;
    line-height: 1.5;
  }

  /* ====== КАТЕГОРИИ ====== */
  .category { margin-bottom: 42px; }
  .category-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 24px;
    font-weight: 800;
    color: #4a2a6a;
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 3px dashed #e8b8d8;
  }
  .category-title .emoji { font-size: 32px; }
  .category-title .count {
    margin-left: auto;
    font-size: 13px;
    font-weight: 700;
    color: #a06a8a;
    background: #fce4ec;
    padding: 4px 14px;
    border-radius: 20px;
    letter-spacing: 0.3px;
  }

  /* ====== СЕТКА КАРТОЧЕК ====== */
  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }

  .game-card {
    display: block;
    background: #ffffff;
    border: 2px solid #f0d8e8;
    border-radius: 22px;
    padding: 22px 24px 20px;
    text-decoration: none;
    color: inherit;
    transition: all 0.35s cubic-bezier(0.34, 1.2, 0.5, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(212, 106, 152, 0.10);
  }

  .game-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 4px;
    background: linear-gradient(90deg, #d46a98, #a06ac8, #d4a06a);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.35s ease;
  }

  .game-card:hover {
    transform: translateY(-6px);
    border-color: #d4a0c8;
    box-shadow: 0 16px 40px rgba(212, 106, 152, 0.22);
  }
  .game-card:hover::before { transform: scaleX(1); }
  .game-card:hover .game-emoji { transform: scale(1.15) rotate(-8deg); }

  .game-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 10px;
  }

  .game-emoji {
    font-size: 44px;
    line-height: 1;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    flex-shrink: 0;
    filter: drop-shadow(0 3px 6px rgba(212, 106, 152, 0.2));
  }

  .game-meta { flex: 1; min-width: 0; }

  .game-title {
    font-size: 18px;
    font-weight: 800;
    color: #3a1a4a;
    line-height: 1.25;
    margin-bottom: 5px;
  }

  .game-class {
    font-size: 12px;
    font-weight: 700;
    color: #a06a8a;
    background: #fce4ec;
    padding: 2px 10px;
    border-radius: 20px;
    display: inline-block;
    letter-spacing: 0.3px;
  }

  .game-desc {
    font-size: 13.5px;
    color: #6a5a7a;
    line-height: 1.55;
    margin-top: 8px;
  }

  .game-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 14px;
  }

  .tag {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 12px;
    letter-spacing: 0.3px;
  }
  .tag-pink    { background: #fce4ec; color: #a03a6a; }
  .tag-purple  { background: #ebe0f7; color: #6a3d9a; }
  .tag-lavender{ background: #f0e8fa; color: #7a5a9a; }
  .tag-gold    { background: #fff4d0; color: #8a6a10; }
  .tag-green   { background: #e0f0e4; color: #2a6a3a; }
  .tag-blue    { background: #e3f0fa; color: #2a5a8a; }
  .tag-rose    { background: #ffe4ec; color: #c2487a; }

  /* ====== ПОДВАЛ ====== */
  .footer {
    text-align: center;
    margin-top: 60px;
    padding: 26px 20px;
    color: #a88ab8;
    font-size: 14px;
    font-style: italic;
    border-top: 2px dashed #f0d8e8;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.6;
  }
  .footer .hearts {
    display: block;
    font-size: 20px;
    letter-spacing: 8px;
    margin-top: 8px;
    opacity: 0.7;
  }

  /* ====== АДАПТИВ ====== */
  @media (max-width: 600px) {
    body { padding: 16px 12px 40px; }
    .main-header h1 { font-size: 26px; }
    .main-header .crown { font-size: 38px; }
    .main-header .subtitle { font-size: 12px; letter-spacing: 2px; }
    .main-header p { font-size: 15px; }
    .category-title { font-size: 19px; }
    .category-title .emoji { font-size: 26px; }
    .games-grid { grid-template-columns: 1fr; gap: 14px; }
    .game-emoji { font-size: 38px; }
    .game-title { font-size: 16px; }
    .game-card { padding: 18px 20px 18px; border-radius: 18px; }
  }
</style>
</head>
<body>

<div class="container">

  <header class="main-header">
    <span class="crown">👑</span>
    <h1>Задания и домашние задания</h1>
    <div class="subtitle">✦ 7 класс ✦ Diana ✦</div>
    <p>Выбирай задание — и выполняй с удовольствием! Здесь собраны все интерактивные тренажёры, тесты и домашние работы.</p>
  </header>

  <div id="gamesContainer"></div>

  <div class="footer">
    💖 Учись с радостью — и всё получится!
    <span class="hearts">🌸 ✨ 💫</span>
  </div>

</div>

<script>
/* ================================================================
   📚 СПИСОК ЗАДАНИЙ
   ================================================================

   ✏️ КАК ДОБАВИТЬ НОВОЕ ЗАДАНИЕ (прямо на GitHub, в браузере):

   1. Загрузите HTML-файл задания в репозиторий Diana7class
      (например, geometriya.html)

   2. Откройте этот файл index.html на GitHub → карандаш ✏️
      (Edit this file)

   3. Найдите массив «games» ниже. Скопируйте шаблон из
      комментария и вставьте его в список. Замените:

      category:      «Математика», «Геометрия», «Русский язык» и т.д.
      categoryEmoji: эмодзи категории (нужен только в первом задании категории)
      file:          ИМЯ ФАЙЛА задания — например, geometriya.html
      emoji:         эмодзи для карточки (📐 ✏️ 🎯 🌸 и т.д.)
      title:         название задания
      class:         для какого класса
      desc:          описание одним предложением
      tags:          теги с цветом (см. таблицу ниже)

   4. Внизу нажмите зелёную кнопку «Commit changes»

   5. Через 1–2 минуты новое задание появится на странице!

   ────────────────────────────────────────────────────────────────

   🎨 ДОСТУПНЫЕ ЦВЕТА ТЕГОВ:
      'pink'     — розовый
      'purple'   — фиолетовый
      'lavender' — лавандовый
      'gold'     — золотой
      'green'    — зелёный
      'blue'     — синий
      'rose'     — насыщенный розовый

   ────────────────────────────────────────────────────────────────

   💡 Если у нового задания другая категория — она создастся автоматически.
   💡 Чтобы временно убрать задание — удалите его блок от { до },
      или поставьте // перед каждой строчкой.
   ================================================================ */

const games = [

  // ═══════════════════════════════════════════════════════════════
  // 📐 ГЕОМЕТРИЯ
  // ═══════════════════════════════════════════════════════════════
  {
    category: 'Геометрия',
    categoryEmoji: '📐',
    file: 'ugol.html',
    emoji: '📏',
    title: 'Луч и угол',
    class: '7 класс',
    desc: 'Тест по теме «Луч и угол»: обозначения, виды углов, градусная мера.',
    tags: [
      { text: 'углы', color: 'pink' },
      { text: 'тест', color: 'purple' }
    ]
  },

  /* ═══════════════════════════════════════════════════════════════
     ➕ НОВЫЕ ЗАДАНИЯ ДОБАВЛЯЙТЕ НИЖЕ ⬇️

     Просто скопируйте шаблон и замените данные:

  {
  category: 'Алгебра',
  categoryEmoji: '📈',
  file: 'grafik.html',
  emoji: '📐',
  title: 'График линейной функции',
  class: '7 класс',
  desc: '10 заданий: формула, построение, точки пересечения.',
  tags: [
    { text: 'графики', color: 'purple' },
    { text: 'функции', color: 'pink' }
  ]
},

  ═══════════════════════════════════════════════════════════════ */

];

/* ================================================================
   ⚙️ ДАЛЬШЕ — АВТОМАТИКА. НЕ ТРОГАЙТЕ ЭТОТ БЛОК.
   ================================================================ */

const categories = [];
const grouped = {};

games.forEach(game => {
  if (!grouped[game.category]) {
    grouped[game.category] = {
      emoji: game.categoryEmoji || '🎮',
      games: []
    };
    categories.push(game.category);
  }
  grouped[game.category].games.push(game);
});

const container = document.getElementById('gamesContainer');
let html = '';

categories.forEach(catName => {
  const cat = grouped[catName];
  html += `
    <section class="category">
      <h2 class="category-title">
        <span class="emoji">${cat.emoji}</span>
        <span>${catName}</span>
        <span class="count">${cat.games.length} ${pluralTasks(cat.games.length)}</span>
      </h2>
      <div class="games-grid">
  `;

  cat.games.forEach(g => {
    const tagsHTML = (g.tags || []).map(t =>
      `<span class="tag tag-${t.color || 'pink'}">${t.text}</span>`
    ).join('');

    html += `
      <a href="${g.file}" class="game-card">
        <div class="game-header">
          <div class="game-emoji">${g.emoji}</div>
          <div class="game-meta">
            <div class="game-title">${g.title}</div>
            <span class="game-class">${g.class}</span>
          </div>
        </div>
        <div class="game-desc">${g.desc}</div>
        <div class="game-tags">${tagsHTML}</div>
      </a>
    `;
  });

  html += `</div></section>`;
});

container.innerHTML = html;

function pluralTasks(n) {
  const mod10 = n % 10;
  const mod100 = n % 100;
  if (mod100 >= 11 && mod100 <= 14) return 'заданий';
  if (mod10 === 1) return 'задание';
  if (mod10 >= 2 && mod10 <= 4) return 'задания';
  return 'заданий';
}
</script>

</body>
</html>
