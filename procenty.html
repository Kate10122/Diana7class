<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проценты. Решение задач с процентами. 7 класс.</title>
<!-- Подключаем библиотеку для салютов (confetti) -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --bg-sand: #EDEAE5;
    --accent-yellow: #FCE181;
    --bg-lemon: #FEF9C7;
    --btn-mint: #9FEDD7;
    --text-teal: #026670;
    --text-dark: #333333;
    --text-light: #666666;
    --white: #ffffff;
    --error: #d32f2f;
    --error-bg: #ffebee;
  }

  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-sand);
    color: var(--text-dark);
    line-height: 1.6;
    padding: 20px 10px 60px;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 30px;
  }

  header h1 {
    font-size: 28px;
    color: var(--text-teal);
    margin-bottom: 10px;
  }

  /* ═══ СЕКЦИЯ С PDF ═══ */
  .pdf-section {
    background: var(--white);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    margin-bottom: 30px;
    border: 2px solid var(--accent-yellow);
  }

  .pdf-section h2 {
    font-size: 20px;
    color: var(--text-teal);
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pdf-container {
    width: 100%;
    height: 600px; /* Высота окна с PDF */
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow: hidden;
    background: #f9f9f9;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 15px;
  }

  .pdf-container iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .pdf-fallback {
    text-align: center;
    padding: 10px;
  }

  .btn-pdf {
    display: inline-block;
    background: var(--accent-yellow);
    color: var(--text-teal);
    font-weight: 700;
    text-decoration: none;
    padding: 10px 24px;
    border-radius: 30px;
    transition: background 0.2s;
    border: 2px solid var(--accent-yellow);
  }

  .btn-pdf:hover {
    background: #ffd54f;
  }

  .pdf-note {
    font-size: 13px;
    color: var(--text-light);
    text-align: center;
    font-style: italic;
  }

  /* ═══ ПРАКТИКА ═══ */
  .practice-header {
    text-align: center;
    margin-bottom: 20px;
  }
  .practice-header h2 {
    font-size: 24px;
    color: var(--text-teal);
  }

  .question-card {
    background: var(--bg-lemon);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    border: 1px solid rgba(2, 102, 112, 0.1);
  }

  .q-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text-teal);
    margin-bottom: 15px;
  }

  .q-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 15px;
  }

  .q-option {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--white);
    padding: 12px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    border: 2px solid transparent;
    font-size: 15px;
  }

  .q-option:hover {
    border-color: var(--accent-yellow);
  }

  .q-option input[type="radio"] {
    accent-color: var(--text-teal);
    width: 18px;
    height: 18px;
    cursor: pointer;
  }

  .q-option.correct-ans {
    background: #e8f5e9;
    border-color: #4caf50;
  }
  .q-option.wrong-ans {
    background: var(--error-bg);
    border-color: var(--error);
  }

  .q-action {
    display: flex;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
  }

  .btn-check {
    background: var(--btn-mint);
    color: var(--text-teal);
    font-weight: 700;
    font-size: 15px;
    padding: 10px 24px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 3px 0 #75d1b8;
  }

  .btn-check:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 0 #75d1b8;
  }
  .btn-check:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #75d1b8;
  }
  .btn-check:disabled {
    background: #ccc;
    box-shadow: 0 3px 0 #999;
    cursor: default;
    transform: none;
  }

  .q-feedback {
    font-size: 14.5px;
    font-weight: 600;
    display: none;
    flex: 1;
    padding: 10px 15px;
    border-radius: 8px;
  }

  .q-feedback.show { display: block; }
  
  .q-feedback.success {
    color: #2e7d32;
    background: #e8f5e9;
    border-left: 4px solid #4caf50;
  }

  .q-feedback.error {
    color: var(--error);
    background: var(--error-bg);
    border-left: 4px solid var(--error);
  }

  .q-feedback .hint-text {
    font-weight: 400;
    margin-top: 5px;
    color: var(--text-dark);
    font-size: 14px;
    display: block;
  }

</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Проценты. Решение задач с процентами.</h1>
    <p style="color: var(--text-teal); font-weight: 600; font-size: 16px;">7 класс</p>
  </header>

  <!-- ═══ ТЕОРИЯ (PDF) ═══ -->
  <section class="pdf-section">
    <h2>📖 Теоретическая часть</h2>
    <div class="pdf-container">
      <!-- Укажите имя вашего файла. Рекомендую переименовать PDF в procenty.pdf (латиницей) для корректной работы -->
      <iframe src="procenty.pdf" title="Теория по процентам"></iframe>
    </div>
    <div class="pdf-fallback">
      <a href="procenty.pdf" target="_blank" class="btn-pdf">📄 Открыть / Скачать PDF</a>
      <p class="pdf-note">💡 Если документ не отображается внутри страницы, нажмите на кнопку выше. (Убедитесь, что файл PDF лежит в той же папке, что и этот HTML-файл).</p>
    </div>
  </section>

  <!-- ═══ ПРАКТИКА ═══ -->
  <div class="practice-header">
    <h2>✍️ Практические задания</h2>
  </div>

  <div id="quiz-container"></div>

</div>

<script>
  // Данные для вопросов
  const questions = [
    {
      id: 1,
      text: "Процент это:",
      options: [
        "во сколько раз число меньше/больше другого",
        "сотая часть числа",
        "арифметическое действие"
      ],
      correct: 1,
      hint: "Вспомни самое первое определение из теории. 1% = 1/100."
    },
    {
      id: 2,
      text: "Процент от числа всегда:",
      options: [
        "один и тот же",
        "зависит от числа, от которого высчитывается процент"
      ],
      correct: 1,
      hint: "10% от 100 — это 10, а 10% от 10 — это 1. Значит, значение зависит от исходного числа."
    },
    {
      id: 3,
      text: "Чтобы найти процент от числа нужно:",
      options: [
        "число умножить на дробь, соответствующую проценту",
        "значение процента умножить на данное число",
        "число разделить на дробь, соответствующую проценту"
      ],
      correct: 0,
      hint: "Чтобы найти часть от целого, нужно целое умножить на эту часть (дробь)."
    },
    {
      id: 4,
      text: "Чтобы найти число по проценту (например: 60% числа составляет 45, найдите число) нужно:",
      options: [
        "число умножить на дробь, соответствующую проценту",
        "число разделить на дробь, соответствующую проценту",
        "нет правильного ответа"
      ],
      correct: 1,
      hint: "Чтобы найти целое по его части, нужно эту часть разделить на соответствующую дробь. В примере: 45 : 0,6 = 75."
    },
    {
      id: 5,
      text: "Чтобы найти процентное отношение двух чисел надо:",
      options: [
        "первое число разделить на второе",
        "второе число разделить на первое и умножить на 100%",
        "первое число разделить на второе и умножить на 100%"
      ],
      correct: 2,
      hint: "Формула: (Часть / Целое) * 100%. Первое число делим на второе и умножаем на 100%."
    },
    {
      id: 6,
      text: "Найдите неверный перевод процента в дробь:",
      options: [
        "5% = 5/100",
        "175% = 175/100",
        "2% = 1/50",
        "10% = 1/100"
      ],
      correct: 3,
      hint: "10% — это 10/100, что при сокращении дает 1/10, а не 1/100."
    },
    {
      id: 7,
      text: "Найдите неверный перевод процента в десятичную дробь:",
      options: [
        "40% = 0,4",
        "30% = 0,30",
        "75% = 7,5",
        "635% = 6,35"
      ],
      correct: 2,
      hint: "75% — это 75/100. При делении на 100 запятая сдвигается на два знака влево, получается 0,75, а не 7,5."
    }
  ];

  const container = document.getElementById('quiz-container');

  // Рендер вопросов
  questions.forEach((q, index) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `q-card-${q.id}`;

    // Заголовок
    const title = document.createElement('div');
    title.className = 'q-title';
    title.textContent = `${index + 1}. ${q.text}`;
    card.appendChild(title);

    // Варианты
    const optsDiv = document.createElement('div');
    optsDiv.className = 'q-options';
    
    q.options.forEach((opt, optIndex) => {
      const label = document.createElement('label');
      label.className = 'q-option';
      label.id = `label-${q.id}-${optIndex}`;
      
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = `question-${q.id}`;
      radio.value = optIndex;
      
      label.appendChild(radio);
      label.appendChild(document.createTextNode(opt));
      
      // При клике убираем старые подсветки ошибок
      radio.addEventListener('change', () => {
        optsDiv.querySelectorAll('.q-option').forEach(el => {
          el.classList.remove('wrong-ans');
        });
        document.getElementById(`fb-${q.id}`).className = 'q-feedback'; // Скрываем фидбек
      });

      optsDiv.appendChild(label);
    });
    card.appendChild(optsDiv);

    // Кнопка и фидбек
    const actionDiv = document.createElement('div');
    actionDiv.className = 'q-action';

    const btn = document.createElement('button');
    btn.className = 'btn-check';
    btn.textContent = 'Проверить';
    btn.onclick = () => checkAnswer(q.id, q.correct);

    const fb = document.createElement('div');
    fb.className = 'q-feedback';
    fb.id = `fb-${q.id}`;

    actionDiv.appendChild(btn);
    actionDiv.appendChild(fb);
    card.appendChild(actionDiv);

    container.appendChild(card);
  });

  // Функция проверки
  function checkAnswer(qId, correctIndex) {
    const card = document.getElementById(`q-card-${qId}`);
    const selectedRadio = card.querySelector('input[type="radio"]:checked');
    const fb = document.getElementById(`fb-${qId}`);
    const btn = card.querySelector('.btn-check');
    
    // Если ничего не выбрано
    if (!selectedRadio) {
      fb.className = 'q-feedback error show';
      fb.innerHTML = '⚠️ Пожалуйста, выберите один из вариантов ответа.';
      return;
    }

    const selectedValue = parseInt(selectedRadio.value);
    const qData = questions.find(q => q.id === qId);

    // Если ответ верный
    if (selectedValue === correctIndex) {
      // Оформление
      document.getElementById(`label-${qId}-${correctIndex}`).classList.add('correct-ans');
      fb.className = 'q-feedback success show';
      fb.innerHTML = '🎉 <strong>Абсолютно верно!</strong> Отличная работа.';
      
      // Блокируем дальнейшие изменения
      card.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);
      btn.disabled = true;
      btn.textContent = 'Верно ✅';

      // Запуск салюта
      triggerConfetti();

    } else {
      // Если неверно
      document.getElementById(`label-${qId}-${selectedValue}`).classList.add('wrong-ans');
      fb.className = 'q-feedback error show';
      fb.innerHTML = `
        ❌ <strong>Неверно.</strong> 
        <span class="hint-text">💡 <em>Подсказка: ${qData.hint}</em></span>
      `;
    }
  }

  // Функция для запуска салюта
  function triggerConfetti() {
    // Выстрел слева
    confetti({
      particleCount: 50,
      spread: 60,
      origin: { x: 0.2, y: 0.6 },
      colors: ['#9FEDD7', '#026670', '#FCE181']
    });
    // Выстрел справа
    confetti({
      particleCount: 50,
      spread: 60,
      origin: { x: 0.8, y: 0.6 },
      colors: ['#9FEDD7', '#026670', '#FCE181']
    });
  }
</script>

</body>
</html>
